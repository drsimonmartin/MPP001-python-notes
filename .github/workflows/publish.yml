on:
  push:
    branches: main

name: Render and Publish Quarto Book

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the packages your notebooks need to run during rendering:
          pip install jupyter pandas numpy matplotlib seaborn otter-grader
          # If you create a requirements.txt file later, you can replace the line above with:
          # pip install -r requirements.txt

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install Atkinson Hyperlegible Font
        run: |
          # Create local font directory
          mkdir -p ~/.local/share/fonts/truetype/atkinson

          # Download fonts from Google Fonts directly into the directory
          wget -q -O ~/.local/share/fonts/truetype/atkinson/AtkinsonHyperlegible-Regular.ttf https://github.com/google/fonts/raw/main/ofl/atkinsonhyperlegible/AtkinsonHyperlegible-Regular.ttf
          wget -q -O ~/.local/share/fonts/truetype/atkinson/AtkinsonHyperlegible-Bold.ttf https://github.com/google/fonts/raw/main/ofl/atkinsonhyperlegible/AtkinsonHyperlegible-Bold.ttf
          wget -q -O ~/.local/share/fonts/truetype/atkinson/AtkinsonHyperlegible-Italic.ttf https://github.com/google/fonts/raw/main/ofl/atkinsonhyperlegible/AtkinsonHyperlegible-Italic.ttf
          wget -q -O ~/.local/share/fonts/truetype/atkinson/AtkinsonHyperlegible-BoldItalic.ttf https://github.com/google/fonts/raw/main/ofl/atkinsonhyperlegible/AtkinsonHyperlegible-BoldItalic.ttf

          # Refresh system font cache
          fc-cache -f -v

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OSFONTDIR: ${{ github.workspace }}/home/runner/.local/share/fonts//
